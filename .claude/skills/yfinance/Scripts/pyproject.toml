[project]
name = "yfinance-skill-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["yfinance[repair]==1.7.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.uv]
default-groups = []
