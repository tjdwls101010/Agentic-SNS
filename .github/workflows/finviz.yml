name: Finviz skill checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  finviz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv run --isolated --frozen --group dev --project .claude/skills/finviz python -m pytest tests/finviz
      - run: uv run --isolated --frozen --group dev --project .claude/skills/finviz ruff check --config pyproject.toml .claude/skills/finviz/scripts tests/finviz
