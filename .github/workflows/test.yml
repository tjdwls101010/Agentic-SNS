name: Social skill checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest==8.4.2 ruff
      - run: python -m pytest tests/ --ignore=tests/sec
      - run: node --test tests/facebook/js/*.js
      - run: python tests/facebook/tools/check_fixtures_pii.py
      - run: ruff check --config pyproject.toml .claude/skills/facebook/scripts tests/facebook
      - run: node --test tests/reddit/js/*.js
      - run: python tests/reddit/tools/check_fixtures_pii.py
      - run: ruff check --config pyproject.toml .claude/skills/reddit/scripts tests/reddit
      - run: node --test tests/threads/js/*.js
      - run: python tests/threads/tools/check_fixtures_pii.py
      - run: ruff check --config pyproject.toml .claude/skills/threads/scripts tests/threads
      - run: node --test tests/twitter/js/*.js
      - run: python tests/twitter/tools/check_fixtures_pii.py
      - run: ruff check --config pyproject.toml .claude/skills/twitter/scripts tests/twitter
      - run: node --test tests/naver_blog/js/*.js
      - run: python tests/naver_blog/tools/check_fixtures_pii.py
      - run: ruff check --config pyproject.toml .claude/skills/naver-blog/scripts tests/naver_blog
  sec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv run --isolated --frozen --group dev --project .claude/skills/sec/Scripts python -m pytest tests/sec
      - run: uv run --isolated --frozen --group dev --project .claude/skills/sec/Scripts ruff check --config pyproject.toml .claude/skills/sec/Scripts tests/sec
